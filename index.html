<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Maintenance Reporter</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h1>School Maintenance Reporter</h1>
        <p>Select your role to continue:</p>
        <div class="role-selection">
            <button id="staff-btn" class="role-btn">Staff - Report Issue</button>
            <button id="worker-btn" class="role-btn">Maintenance Worker - View Tasks</button>
        </div>
        <div id="info">
            <p>This Progressive Web App allows you to report maintenance issues and track their resolution.</p>
            <p>To install: Use your browser's menu and select "Add to Home screen"</p>
        </div>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
