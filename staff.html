<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff - Report Issue</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Staff - Report Issue</h1>
        <form id="issueForm">
            <div class="form-group">
                <label for="description">Omschrijving *</label>
                <textarea id="description" name="description" required></textarea>
            </div>
            
            <div class="form-group">
                <label for="location">Welke klas? Welk lokaal? *</label>
                <input type="text" id="location" name="location" required>
            </div>
            
            <div class="form-group">
                <label for="urgency">Prioriteit *</label>
                <select id="urgency" name="urgency" required>
                    <option value="">Select urgency</option>
                    <option value="Normal">Normal</option>
                    <option value="Important">Important</option>
                    <option value="Urgent">Urgent</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="photo">Foto's (optioneel, max 3)</label>
                <div class="photo-upload">
                    <input type="file" id="photo" name="photo" accept="image/jpeg,image/png,image/webp" multiple>
                    <button type="button" id="capturePhoto" class="cancel-btn">Foto maken</button>
                    <div id="photo-preview" style="margin-top:0.5rem;"></div>
                </div>
                <small>Maximaal 3 foto's, elk max 5MB</small>
            </div>
            
            <button type="submit" class="submit-btn">Issue melden</button>
            <button type="button" class="cancel-btn" id="cancelButton">Annuleren</button>
        </form>
        
        <div id="form-message" class="message hidden"></div>
    </div>
    <script type="module" src="js/staff.js"></script>
</body>
</html>
