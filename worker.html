<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Worker - School Maintenance</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
            <h1>Maintenance Worker</h1>
            <button id="logout-btn" class="cancel-btn" style="padding:0.5rem 1rem;font-size:0.9rem;">Logout</button>
        </header>
        
        <!-- Dashboard Section -->
        <div id="dashboard">
            <h2>Overzicht</h2>
            <div class="dashboard-stats">
                <div class="stat-card urgent">
                    <h3>Urgent</h3>
                    <p id="urgent-count">0</p>
                </div>
                <div class="stat-card important">
                    <h3>Important</h3>
                    <p id="important-count">0</p>
                </div>
                <div class="stat-card normal">
                    <h3>Normal</h3>
                    <p id="normal-count">0</p>
                </div>
                <div class="stat-card in-progress">
                    <h3>In Progress</h3>
                    <p id="in-progress-count">0</p>
                </div>
                <div class="stat-card waiting">
                    <h3>Waiting</h3>
                    <p id="waiting-count">0</p>
                </div>
                <div class="stat-card completed">
                    <h3>Completed</h3>
                    <p id="completed-count">0</p>
                </div>
            </div>
        </div>
        
        <div class="worker-toolbar">
            <div class="filter-group">
                <label for="filter-status">Status:</label>
                <select id="filter-status">
                    <option value="">All</option>
                    <option value="New">New</option>
                    <option value="Planned">Planned</option>
                    <option value="In progress">In progress</option>
                    <option value="Waiting for materials">Waiting for materials</option>
                    <option value="Completed">Completed</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filter-urgency">Urgency:</label>
                <select id="filter-urgency">
                    <option value="">All</option>
                    <option value="Normal">Normal</option>
                    <option value="Important">Important</option>
                    <option value="Urgent">Urgent</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filter-location">Location:</label>
                <input type="text" id="filter-location" placeholder="Filter by location">
            </div>
            <button id="apply-filters" class="submit-btn">Apply Filters</button>
            <button id="reset-filters" class="cancel-btn">Reset</button>
        </div>
        
        <div id="task-list-container">
            <h2>Taken</h2>
            <div id="task-list-loading">Taken laden...</div>
            <ul id="task-list" class="task-list"></ul>
        </div>
        
        <div id="task-detail-container" class="hidden">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
                <h2>Taak Details</h2>
                <button id="back-to-list" class="cancel-btn">&#8592; Terug naar lijst</button>
            </div>
            <div id="task-detail-content">
                <!-- Taak detail zal hier worden ingevoegd -->
            </div>
        </div>
    </div>
    <script type="module" src="js/worker.js"></script>
</body>
</html>
